apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-backend
  labels:
    app: mern-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mern-backend
  template:
    metadata:
      labels:
        app: mern-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      
      initContainers:
      # Ensures MongoDB StatefulSet is healthy and accepting connections before backend starts
      - name: wait-for-mongodb
        image: busybox:1.36
        command: ['sh', '-c', 'echo "Waiting for MongoDB..."; until nc -z -w 2 mongodb 27017; do sleep 2; done; echo "MongoDB is up!"']
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000 
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
      containers:
      - name: backend-app
        image: rimisarker/mern-backend:prod-5
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false 
          capabilities:
            drop:
            - ALL
        env:
        # Fetches MongoDB credentials synced by ExternalSecrets operator
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password
        # Constructs connection string dynamically using standard K8s headless service endpoint
        - name: MONGO_URI
          value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongodb:27017/mern-db?authSource=admin"
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: mern-backend-service
  labels:
    app: mern-backend
spec:
  type: ClusterIP # Keeps backend securely accessible only inside the cluster
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  selector:
    app: mern-backend